name: Verify portfolio and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/reports/**'
      - 'images/screenshots/**'
  workflow_dispatch:

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install verification tools (not website dependencies)
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chrome
          sudo apt-get install -y fonts-noto-cjk
      - name: Check mandatory structure and JavaScript syntax
        run: python tests/static_checks.py
      - name: Browser checks with controlled API responses
        run: python tests/browser_checks.py --channel chrome
      - name: Verify real GitHub API and capture submission screenshots
        run: python tests/live_check.py --channel chrome --screenshots
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-verification
          path: |
            test-results/
            images/screenshots/
      - name: Record successful verification and screenshots in repository
        run: |
          mkdir -p docs/reports
          cp test-results/static.json docs/reports/static.json
          cp test-results/browser.json docs/reports/browser.json
          cp test-results/live.json docs/reports/live.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reports images/screenshots
          if ! git diff --cached --quiet; then
            git commit -m 'test: record browser verification and screenshots [skip ci]'
            git push origin HEAD:main
          fi
      - name: Package only the static website
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r css js images _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy static website
        id: deployment
        uses: actions/deploy-pages@v4

  verify-deployed:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser verification tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chrome
      - name: Check deployed page with real GitHub API
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python tests/live_check.py --channel chrome --base-url "$SITE_URL" --report deployed-live.json
      - name: Verify deployed error states, form and responsiveness
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python tests/browser_checks.py --channel chrome --base-url "$SITE_URL"
      - name: Preserve deployed test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-verification
          path: test-results/
