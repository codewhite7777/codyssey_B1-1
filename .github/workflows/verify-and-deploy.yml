name: Verify portfolio

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/reports/**'
      - 'images/screenshots/**'
  workflow_dispatch:

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# 배포는 gh-pages 브랜치의 GitHub 기본 "pages build and deployment"가 담당합니다.
# 이 워크플로는 원본 및 이미 게시된 사이트를 각각 검사하고 결과를 기록합니다.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SITE_URL: https://codewhite7777.github.io/codyssey_B1-1/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install verification tools (not website dependencies)
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chrome
          sudo apt-get install -y fonts-noto-cjk
      - name: Check mandatory structure and JavaScript syntax
        run: python tests/static_checks.py
      - name: Browser checks on original files with controlled API responses
        run: |
          python tests/browser_checks.py --channel chrome
          cp test-results/browser.json test-results/source-browser.json
      - name: Verify real GitHub API on original files
        env:
          CI_GITHUB_TOKEN: ${{ github.token }}
        run: python tests/live_check.py --channel chrome
      - name: Compare published runtime files with verified source
        run: python tests/check_published_files.py
      - name: Verify public website with real API and capture screenshots
        env:
          CI_GITHUB_TOKEN: ${{ github.token }}
        run: python tests/live_check.py --channel chrome --base-url "$SITE_URL" --report deployed-live.json --screenshots
      - name: Verify public website error states form and responsiveness
        run: |
          python tests/browser_checks.py --channel chrome --base-url "$SITE_URL"
          cp test-results/browser.json test-results/deployed-browser.json
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-verification
          path: |
            test-results/
            images/screenshots/
      - name: Record successful verification and screenshots in repository
        run: |
          mkdir -p docs/reports
          cp test-results/static.json docs/reports/static.json
          cp test-results/source-browser.json docs/reports/browser.json
          cp test-results/live.json docs/reports/live.json
          cp test-results/deployed-live.json docs/reports/deployed-live.json
          cp test-results/deployed-browser.json docs/reports/deployed-browser.json
          cp test-results/published-files.json docs/reports/published-files.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reports images/screenshots
          if ! git diff --cached --quiet; then
            git commit -m 'test: record source and published browser verification [skip ci]'
            git push origin HEAD:main
          fi
