<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img"><title>fetch와 async/await, try/catch로 로딩/성공/빈/에러 상태를 나누는 흐름</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker></defs><rect width="760" height="560" fill="#FFFFFF" rx="12"/><text xml:space="preserve" x="380" y="24" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="17" font-weight="700" fill="#2C2C2A">loadProjects(): 상태 4가지로 나뉘는 길</text><rect x="270" y="46" width="220" height="36" rx="18" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text xml:space="preserve" x="380" y="64" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">페이지 시작 · 다시 시도 클릭</text><line x1="380" y1="84" x2="380" y2="100" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="260" y="102" width="240" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text xml:space="preserve" x="380.0" y="116.5" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="14" font-weight="700" fill="#0C447C">STATE = "loading"</text><text xml:space="preserve" x="380.0" y="135.5" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#0C447C">스피너 + 로딩 중...</text><rect x="150" y="172" width="460" height="252" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text xml:space="preserve" x="166" y="188" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#5F5E5A">try {</text><line x1="380" y1="156" x2="380" y2="196" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="270" y="198" width="220" height="36" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="380" y="216" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#2C2C2A">await fetch(GitHub API)</text><line x1="380" y1="236" x2="380" y2="254" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><polygon points="380,255.0 465.0,280 380,305.0 295.0,280" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text xml:space="preserve" x="380" y="280" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#633806">response.ok ?</text><line x1="380" y1="306" x2="380" y2="322" stroke="#085041" stroke-width="1.6" marker-end="url(#ah)"/><text xml:space="preserve" x="394" y="313" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="400" fill="#085041">예</text><rect x="270" y="324" width="220" height="36" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="380" y="342" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#2C2C2A">await json() → filter → slice</text><line x1="380" y1="362" x2="380" y2="374" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><polygon points="380,375.0 455.0,398 380,421.0 305.0,398" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text xml:space="preserve" x="380" y="398" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#633806">개수 &gt; 0 ?</text><rect x="560" y="452" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text xml:space="preserve" x="650.0" y="468.5" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="700" fill="#085041">STATE = "success"</text><text xml:space="preserve" x="650.0" y="487.0" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#085041">카드 6장</text><rect x="290" y="452" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text xml:space="preserve" x="380.0" y="469.0" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="700" fill="#2C2C2A">STATE = "empty"</text><text xml:space="preserve" x="380.0" y="487.0" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="400" fill="#2C2C2A">표시할 프로젝트가 없습니다.</text><path d="M455,398 H650 V450" fill="none" stroke="#085041" stroke-width="1.6" marker-end="url(#ah)"/><text xml:space="preserve" x="560" y="388" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="400" fill="#085041">예</text><line x1="380" y1="421" x2="380" y2="450" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><text xml:space="preserve" x="405" y="436" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">아니오</text><path d="M295,280 H90" fill="none" stroke="#993C1D" stroke-width="1.6"/><path d="M268,216 H90 V450" fill="none" stroke="#993C1D" stroke-width="1.6" marker-end="url(#ah)"/><text xml:space="preserve" x="200" y="268" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="400" fill="#712B13">아니오 (403, 404 …) → throw</text><text xml:space="preserve" x="200" y="230" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="400" fill="#712B13">fetch 실패 (네트워크 끊김)</text><text xml:space="preserve" x="166" y="438" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#5F5E5A">} catch {</text><rect x="20" y="452" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text xml:space="preserve" x="120.0" y="469.0" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="700" fill="#712B13">STATE = "error"</text><text xml:space="preserve" x="120.0" y="487.0" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="400" fill="#712B13">불러올 수 없습니다 + 다시 시도</text><path d="M20,480 H8 V128 H256" fill="none" stroke="#993C1D" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5 4"/><text xml:space="preserve" x="14" y="120" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="600" fill="#712B13">다시 시도</text><text xml:space="preserve" x="380" y="534" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">어느 길이든 마지막에 renderProjects()를 한 번 불러 상태대로 그림</text></svg>
