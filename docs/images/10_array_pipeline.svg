<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img"><title>GitHub 데이터를 배열 메서드로 카드 HTML로 바꾸는 과정</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker></defs><rect width="760" height="520" fill="#FFFFFF" rx="12"/><text xml:space="preserve" x="380" y="24" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="16" font-weight="700" fill="#2C2C2A">GitHub 응답 → 배열 메서드 → 카드 (예: 저장소 8개 중 fork 2개)</text><rect x="20" y="52" width="270" height="44" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text xml:space="preserve" x="32" y="74" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#2C2C2A">await response.json()</text><line x1="292" y1="74" x2="318" y2="74" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="324" y="61" width="26" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="356" y="61" width="26" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="388" y="61" width="26" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="420" y="61" width="26" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text xml:space="preserve" x="433.0" y="74" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="9" font-weight="600" fill="#5F5E5A">fork</text><rect x="452" y="61" width="26" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="484" y="61" width="26" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="516" y="61" width="26" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="548" y="61" width="26" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text xml:space="preserve" x="561.0" y="74" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="9" font-weight="600" fill="#5F5E5A">fork</text><text xml:space="preserve" x="588" y="74" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">저장소 객체 8개 (배열)</text><line x1="155" y1="98" x2="155" y2="108" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="20" y="110" width="270" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text xml:space="preserve" x="32" y="132" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#0C447C">.filter((repo) =&gt; !repo.fork)</text><line x1="292" y1="132" x2="318" y2="132" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="324" y="119" width="26" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="356" y="119" width="26" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="388" y="119" width="26" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="420" y="119" width="26" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="452" y="119" width="26" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="484" y="119" width="26" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text xml:space="preserve" x="524" y="132" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">조건이 true인 것만 남김 → 6개</text><line x1="155" y1="156" x2="155" y2="166" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="20" y="168" width="270" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text xml:space="preserve" x="32" y="190" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#0C447C">.slice(0, PROJECT_COUNT)</text><line x1="292" y1="190" x2="318" y2="190" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="324" y="177" width="26" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="356" y="177" width="26" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="388" y="177" width="26" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="420" y="177" width="26" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="452" y="177" width="26" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="484" y="177" width="26" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text xml:space="preserve" x="524" y="190" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">앞에서 최대 6개 (최근 업데이트 순)</text><line x1="155" y1="214" x2="155" y2="224" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="20" y="226" width="270" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text xml:space="preserve" x="32" y="248" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#0C447C">.map(createCard)</text><line x1="292" y1="248" x2="318" y2="248" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="324" y="235" width="26" height="26" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><rect x="356" y="235" width="26" height="26" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><rect x="388" y="235" width="26" height="26" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><rect x="420" y="235" width="26" height="26" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><rect x="452" y="235" width="26" height="26" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><rect x="484" y="235" width="26" height="26" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text xml:space="preserve" x="524" y="248" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">객체 1개 → 카드 HTML 문자열 1개 (6개)</text><line x1="155" y1="272" x2="155" y2="282" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="20" y="284" width="270" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text xml:space="preserve" x="32" y="306" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#0C447C">.join("")</text><line x1="292" y1="306" x2="318" y2="306" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="324" y="293" width="196" height="26" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text xml:space="preserve" x="332" y="306" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#633806">"&lt;article&gt;…&lt;/article&gt;&lt;article&gt;…"</text><text xml:space="preserve" x="530" y="306" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">문자열 6개를 하나로 이어 붙임</text><line x1="155" y1="330" x2="155" y2="340" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="20" y="342" width="270" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text xml:space="preserve" x="32" y="364" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#0C447C">projectGrid.innerHTML = …</text><line x1="292" y1="364" x2="318" y2="364" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="324" y="346" width="52" height="36" rx="5" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><rect x="330" y="352" width="30" height="5" rx="2" fill="#0F6E56"/><rect x="330" y="362" width="40" height="4" rx="2" fill="#B4B2A9"/><rect x="330" y="370" width="24" height="4" rx="2" fill="#B4B2A9"/><rect x="382" y="346" width="52" height="36" rx="5" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><rect x="388" y="352" width="30" height="5" rx="2" fill="#0F6E56"/><rect x="388" y="362" width="40" height="4" rx="2" fill="#B4B2A9"/><rect x="388" y="370" width="24" height="4" rx="2" fill="#B4B2A9"/><rect x="440" y="346" width="52" height="36" rx="5" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><rect x="446" y="352" width="30" height="5" rx="2" fill="#0F6E56"/><rect x="446" y="362" width="40" height="4" rx="2" fill="#B4B2A9"/><rect x="446" y="370" width="24" height="4" rx="2" fill="#B4B2A9"/><text xml:space="preserve" x="500" y="364" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">화면에 카드 6장</text><line x1="20" y1="402" x2="740" y2="402" stroke="#D3D1C7" stroke-width="1"/><text xml:space="preserve" x="20" y="420" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="700" fill="#2C2C2A">createCard 안에서: 구조분해 할당으로 필요한 값만 꺼내고, 템플릿 리터럴로 HTML을 만든다</text><rect x="20" y="436" width="220" height="70" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text xml:space="preserve" x="30" y="452" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#2C2C2A">{ name, description,</text><text xml:space="preserve" x="30" y="469" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#2C2C2A">  language, stargazers_count,</text><text xml:space="preserve" x="30" y="486" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#2C2C2A">  html_url, … (키 수십 개) }</text><line x1="242" y1="471" x2="268" y2="471" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="270" y="436" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="280" y="452" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#2C2C2A">const { name,</text><text xml:space="preserve" x="280" y="469" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#2C2C2A">  stargazers_count: stars,</text><text xml:space="preserve" x="280" y="486" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#2C2C2A">  html_url: url } = repo;</text><line x1="472" y1="471" x2="498" y2="471" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="500" y="436" width="240" height="70" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text xml:space="preserve" x="510" y="452" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#633806">`&lt;article&gt;</text><text xml:space="preserve" x="510" y="469" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#633806">  &lt;a href="${url}"&gt;${name}&lt;/a&gt;</text><text xml:space="preserve" x="510" y="486" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#633806">  ★ ${stars}&lt;/article&gt;`</text></svg>
