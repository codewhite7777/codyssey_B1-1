<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img"><title>비유: 이벤트→상태→화면은 경기장 점수 기록지와 전광판. 전광판은 기록지만 보고 표시</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker></defs><rect width="760" height="380" fill="#FFFFFF" rx="12"/><text xml:space="preserve" x="380" y="26" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="18" font-weight="700" fill="#2C2C2A">비유 ⑦ 이벤트 → 상태 → 화면 = 점수 기록지와 전광판</text><rect x="20" y="50" width="225" height="160" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="132" y="90" text-anchor="middle" dominant-baseline="central" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif" font-size="42">⚽</text><text xml:space="preserve" x="132" y="134" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="14" font-weight="700" fill="#0C447C">① 골! (이벤트)</text><text xml:space="preserve" x="132" y="160" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#0C447C">사용자가 버튼 클릭</text><line x1="247" y1="130" x2="263" y2="130" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="265" y="50" width="225" height="160" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="377" y="90" text-anchor="middle" dominant-baseline="central" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif" font-size="42">📋</text><text xml:space="preserve" x="377" y="134" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="14" font-weight="700" fill="#633806">② 기록지에 적기 (상태)</text><text xml:space="preserve" x="377" y="160" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#633806">심판 = 이벤트 핸들러</text><text xml:space="preserve" x="377" y="180" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#633806">STATE.theme = "dark"</text><line x1="492" y1="130" x2="508" y2="130" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="510" y="50" width="225" height="160" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="622" y="90" text-anchor="middle" dominant-baseline="central" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif" font-size="42">🏟️</text><text xml:space="preserve" x="622" y="134" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="14" font-weight="700" fill="#085041">③ 전광판 (화면)</text><text xml:space="preserve" x="622" y="160" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#085041">render 함수가</text><text xml:space="preserve" x="622" y="180" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#085041">기록지를 그대로 표시</text><rect x="250" y="226" width="260" height="70" rx="8" fill="#172721"/><text xml:space="preserve" x="380" y="248" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#a6e0b5">STATE</text><text xml:space="preserve" x="380" y="274" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#EDF5EE">theme: dark · menuOpen: false</text><rect x="20" y="310" width="720" height="54" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text xml:space="preserve" x="380" y="328" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="700" fill="#2C2C2A">전광판을 손으로 고치지 않는다 → 기록지만 고치면 전광판은 따라 바뀐다</text><text xml:space="preserve" x="380" y="348" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">화면이 이상하면 기록지(STATE)부터 본다 = STATE 객체를 따로 둔 이유</text></svg>
