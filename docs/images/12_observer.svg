<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img"><title>Intersection Observer: 요소가 20% 보이면 visible 클래스를 붙인다</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker></defs><rect width="760" height="350" fill="#FFFFFF" rx="12"/><text xml:space="preserve" x="380" y="24" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="16" font-weight="700" fill="#2C2C2A">IntersectionObserver · threshold 0.2 = 요소가 20% 보이면 알려 줌</text><text xml:space="preserve" x="140" y="54" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">① 아직 화면 밖</text><rect x="60" y="72" width="160" height="150" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="2"/><text xml:space="preserve" x="140" y="86" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="10" font-weight="400" fill="#5F5E5A">화면(뷰포트)</text><rect x="80" y="232" width="120" height="60" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/><text xml:space="preserve" x="140" y="262" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#2C2C2A">.reveal</text><text xml:space="preserve" x="140" y="314" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#2C2C2A">opacity: 0</text><text xml:space="preserve" x="140" y="334" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">아직 아무 일 없음</text><text xml:space="preserve" x="385" y="54" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">② 20% 들어옴</text><rect x="305" y="72" width="160" height="150" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="2"/><text xml:space="preserve" x="385" y="86" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="10" font-weight="400" fill="#5F5E5A">화면(뷰포트)</text><rect x="325" y="210" width="120" height="60" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text xml:space="preserve" x="385" y="240" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#085041">.reveal</text><rect x="325" y="210" width="120" height="12" fill="#0F6E56" opacity="0.35"/><line x1="451" y1="210" x2="451" y2="222" stroke="#0F6E56" stroke-width="2"/><text xml:space="preserve" x="457" y="216" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="700" fill="#085041">20%</text><text xml:space="preserve" x="385" y="314" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#085041">visible 추가</text><text xml:space="preserve" x="385" y="334" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">콜백 실행 → 올라오며 나타남</text><text xml:space="preserve" x="630" y="54" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">③ 다 보임</text><rect x="550" y="72" width="160" height="150" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="2"/><text xml:space="preserve" x="630" y="86" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="10" font-weight="400" fill="#5F5E5A">화면(뷰포트)</text><rect x="570" y="110" width="120" height="60" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text xml:space="preserve" x="630" y="140" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#085041">.reveal</text><text xml:space="preserve" x="630" y="314" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#085041">opacity: 1</text><text xml:space="preserve" x="630" y="334" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">unobserve → 더는 감시 안 함</text></svg>
