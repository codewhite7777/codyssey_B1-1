<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img"><title>이벤트 → 상태 변경 → 화면 업데이트 흐름</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker></defs><rect width="760" height="470" fill="#FFFFFF" rx="12"/><text xml:space="preserve" x="380" y="24" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="17" font-weight="700" fill="#2C2C2A">이벤트 → 상태(STATE) 변경 → 화면 업데이트</text><rect x="20" y="48" width="210" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text xml:space="preserve" x="125.0" y="66" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="15" font-weight="700" fill="#0C447C">① 이벤트</text><text xml:space="preserve" x="125.0" y="88" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#0C447C">사용자가 무언가 함</text><rect x="250" y="48" width="210" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text xml:space="preserve" x="355.0" y="66" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="15" font-weight="700" fill="#633806">② 상태 변경</text><text xml:space="preserve" x="355.0" y="88" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#633806">핸들러는 STATE만 바꿈</text><rect x="480" y="48" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text xml:space="preserve" x="610.0" y="66" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="15" font-weight="700" fill="#085041">③ 화면 업데이트</text><text xml:space="preserve" x="610.0" y="88" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#085041">render는 STATE대로 그림</text><line x1="232" y1="76" x2="248" y2="76" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="462" y1="76" x2="478" y2="76" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><path d="M610,106 V128 H125 V110" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5 4"/><text xml:space="preserve" x="380" y="140" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">바뀐 화면을 보고 사용자가 다시 행동</text><rect x="20" y="162" width="210" height="42" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="30" y="183" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#0C447C">다크 모드 버튼 click</text><rect x="250" y="162" width="210" height="42" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="260" y="183" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#633806">STATE.theme = "dark"</text><rect x="480" y="162" width="260" height="42" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="490" y="183" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#085041">renderTheme() → data-theme="dark"</text><line x1="232" y1="183" x2="248" y2="183" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="462" y1="183" x2="478" y2="183" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="20" y="214" width="210" height="42" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="30" y="235" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#0C447C">햄버거 버튼 click</text><rect x="250" y="214" width="210" height="42" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="260" y="235" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#633806">STATE.menuOpen = true</text><rect x="480" y="214" width="260" height="42" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="490" y="235" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#085041">renderMenu() → .nav-menu에 active</text><line x1="232" y1="235" x2="248" y2="235" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="462" y1="235" x2="478" y2="235" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="20" y="266" width="210" height="42" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="30" y="287" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#0C447C">페이지 시작 / 다시 시도</text><rect x="250" y="266" width="210" height="42" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="260" y="287" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#633806">STATE.projectStatus = …</text><rect x="480" y="266" width="260" height="42" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="490" y="287" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#085041">renderProjects() → 스피너/카드/메시지</text><line x1="232" y1="287" x2="248" y2="287" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="462" y1="287" x2="478" y2="287" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="20" y="318" width="210" height="42" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="30" y="339" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#0C447C">폼 input / submit</text><rect x="250" y="318" width="210" height="42" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="260" y="339" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#633806">STATE.formErrors = {…}</text><rect x="480" y="318" width="260" height="42" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="490" y="339" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#085041">renderForm() → 오류 문구, 빨간 테두리</text><line x1="232" y1="339" x2="248" y2="339" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="462" y1="339" x2="478" y2="339" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="150" y="386" width="460" height="66" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text xml:space="preserve" x="380" y="406" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">규칙</text><text xml:space="preserve" x="380" y="430" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="400" fill="#2C2C2A">화면이 왜 이렇게 보이지? → 답은 항상 STATE에 있다</text></svg>
