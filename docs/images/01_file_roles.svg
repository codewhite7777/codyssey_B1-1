<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img"><title>HTML, CSS, JS의 역할: 다크 모드 버튼 하나가 세 파일에 나뉘어 있는 모습</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker></defs><rect width="760" height="430" fill="#FFFFFF" rx="12"/><text xml:space="preserve" x="380" y="26" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="17" font-weight="700" fill="#2C2C2A">버튼 하나 = 세 파일이 나눠서 맡음</text><rect x="30" y="50" width="220" height="170" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text xml:space="preserve" x="140" y="74" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#0C447C">index.html</text><text xml:space="preserve" x="140" y="98" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="400" fill="#0C447C">구조 · 무엇이 있나</text><rect x="42" y="116" width="196" height="88" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="52" y="136" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">&lt;button</text><text xml:space="preserve" x="52" y="158" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">  class="theme-button"&gt;</text><text xml:space="preserve" x="52" y="180" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">  다크 모드&lt;/button&gt;</text><line x1="140" y1="222" x2="320" y2="282" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="270" y="50" width="220" height="170" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text xml:space="preserve" x="380" y="74" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#633806">css/style.css</text><text xml:space="preserve" x="380" y="98" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="400" fill="#633806">모양 · 어떻게 보이나</text><rect x="282" y="116" width="196" height="88" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="292" y="136" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">.theme-button {</text><text xml:space="preserve" x="292" y="158" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">  border-radius: 999px;</text><text xml:space="preserve" x="292" y="180" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">}</text><line x1="380" y1="222" x2="380" y2="282" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="510" y="50" width="220" height="170" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text xml:space="preserve" x="620" y="74" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#085041">js/app.js</text><text xml:space="preserve" x="620" y="98" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="400" fill="#085041">동작 · 무엇이 바뀌나</text><rect x="522" y="116" width="196" height="88" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="532" y="136" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">themeButton</text><text xml:space="preserve" x="532" y="158" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">  .addEventListener(</text><text xml:space="preserve" x="532" y="180" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">    "click", ...)</text><line x1="620" y1="222" x2="440" y2="282" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="200" y="286" width="360" height="120" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text xml:space="preserve" x="380" y="308" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="15" font-weight="700" fill="#2C2C2A">브라우저가 셋을 합쳐 화면을 그림</text><rect x="320" y="328" width="120" height="34" rx="17" fill="#FFFFFF" stroke="#CDD7CF" stroke-width="1"/><text xml:space="preserve" x="380" y="345" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="14" font-weight="400" fill="#2C2C2A">다크 모드</text><text xml:space="preserve" x="380" y="384" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="400" fill="#5F5E5A">→ 누르면 화면 전체 색이 바뀜</text></svg>
