<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img"><title>DOM 트리에서 querySelector로 요소를 찾고 addEventListener로 이벤트를 붙이는 과정</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker></defs><rect width="760" height="560" fill="#FFFFFF" rx="12"/><text xml:space="preserve" x="380" y="24" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="16" font-weight="700" fill="#2C2C2A">HTML → DOM 트리 → 찾아서(querySelector) → 붙이기(addEventListener)</text><rect x="30" y="56" width="120" height="28" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text xml:space="preserve" x="40" y="70" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">document</text><rect x="52" y="92" width="120" height="28" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text xml:space="preserve" x="62" y="106" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">html</text><rect x="74" y="128" width="120" height="28" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text xml:space="preserve" x="84" y="142" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">body</text><rect x="96" y="164" width="120" height="28" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text xml:space="preserve" x="106" y="178" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">header</text><rect x="118" y="200" width="120" height="28" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text xml:space="preserve" x="128" y="214" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">nav</text><rect x="140" y="236" width="170" height="28" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text xml:space="preserve" x="150" y="250" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#085041">button.theme-button</text><rect x="96" y="272" width="120" height="28" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text xml:space="preserve" x="106" y="286" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">main</text><rect x="118" y="308" width="150" height="28" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text xml:space="preserve" x="128" y="322" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">section#projects …</text><path d="M40,84 V106 H52" fill="none" stroke="#B4B2A9" stroke-width="1"/><path d="M62,120 V142 H74" fill="none" stroke="#B4B2A9" stroke-width="1"/><path d="M84,156 V178 H96" fill="none" stroke="#B4B2A9" stroke-width="1"/><path d="M106,192 V214 H118" fill="none" stroke="#B4B2A9" stroke-width="1"/><path d="M128,228 V250 H140" fill="none" stroke="#B4B2A9" stroke-width="1"/><path d="M84,156 V286 H96" fill="none" stroke="#B4B2A9" stroke-width="1"/><path d="M106,300 V322 H118" fill="none" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="130" y="352" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">브라우저가 HTML을 읽어 만든 객체 나무 = DOM</text><rect x="330" y="56" width="400" height="84" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text xml:space="preserve" x="346" y="74" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="14" font-weight="700" fill="#0C447C">①  찾기</text><text xml:space="preserve" x="346" y="100" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">document.querySelector(".theme-button")</text><text xml:space="preserve" x="346" y="122" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#0C447C">CSS 선택자로 트리에서 요소 하나를 찾음</text><line x1="530" y1="142" x2="530" y2="152" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="330" y="154" width="400" height="84" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text xml:space="preserve" x="346" y="172" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="14" font-weight="700" fill="#633806">②  붙이기</text><text xml:space="preserve" x="346" y="198" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">themeButton.addEventListener("click", 함수)</text><text xml:space="preserve" x="346" y="220" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#633806">"클릭되면 이 함수를 실행해" 라고 등록</text><line x1="530" y1="240" x2="530" y2="250" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="330" y="252" width="400" height="84" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text xml:space="preserve" x="346" y="270" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="14" font-weight="700" fill="#085041">③  실행</text><text xml:space="preserve" x="346" y="296" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#2C2C2A">사용자가 클릭 → 등록한 함수가 실행</text><text xml:space="preserve" x="346" y="318" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#085041">함수 안에서 STATE를 바꾸고 화면을 갱신</text><line x1="312" y1="250" x2="326" y2="100" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5 4"/><line x1="30" y1="372" x2="730" y2="372" stroke="#D3D1C7" stroke-width="1"/><text xml:space="preserve" x="380" y="394" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="15" font-weight="700" fill="#2C2C2A">onclick 속성은 자리가 하나, addEventListener는 목록</text><rect x="30" y="412" width="340" height="132" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text xml:space="preserve" x="46" y="432" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">button.onclick = 함수A;</text><text xml:space="preserve" x="46" y="452" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">button.onclick = 함수B;  // A를 덮어씀</text><rect x="46" y="478" width="308" height="50" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="60" y="503" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">클릭 →</text><rect x="120" y="488" width="64" height="30" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text xml:space="preserve" x="152" y="503" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">함수A</text><line x1="124" y1="503" x2="180" y2="503" stroke="#993C1D" stroke-width="2"/><rect x="196" y="488" width="64" height="30" rx="5" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text xml:space="preserve" x="228" y="503" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="700" fill="#712B13">함수B</text><text xml:space="preserve" x="276" y="503" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#712B13">만 실행</text><rect x="390" y="412" width="340" height="132" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text xml:space="preserve" x="406" y="432" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">addEventListener("click", 함수A);</text><text xml:space="preserve" x="406" y="452" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">addEventListener("click", 함수B);</text><rect x="406" y="478" width="308" height="50" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="420" y="503" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">클릭 →</text><rect x="480" y="488" width="64" height="30" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text xml:space="preserve" x="512" y="503" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="700" fill="#085041">함수A</text><rect x="556" y="488" width="64" height="30" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text xml:space="preserve" x="588" y="503" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="700" fill="#085041">함수B</text><text xml:space="preserve" x="640" y="503" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#085041">둘 다 실행</text></svg>
