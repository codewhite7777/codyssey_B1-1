<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img"><title>repeat(auto-fit, minmax(280px, 1fr))가 화면 폭에 따라 열 개수를 정하는 모습</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker></defs><rect width="760" height="400" fill="#FFFFFF" rx="12"/><text xml:space="preserve" x="380" y="24" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#2C2C2A">repeat(auto-fit, minmax(280px, 1fr))</text><text xml:space="preserve" x="380" y="48" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">카드는 최소 280px · 들어가는 만큼 열을 만들고 · 남는 폭은 똑같이(1fr) 나눔</text><text xml:space="preserve" x="20" y="114" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="700" fill="#2C2C2A">휴대폰 390px</text><rect x="140" y="80" width="179.0" height="70" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/><rect x="148.0" y="90" width="163.0" height="50" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text xml:space="preserve" x="229.5" y="115" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="600" fill="#633806">카드</text><text xml:space="preserve" x="329.0" y="115" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="700" fill="#633806">→ 1열</text><text xml:space="preserve" x="20" y="218" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="700" fill="#2C2C2A">태블릿 768px</text><rect x="140" y="184" width="368.0" height="70" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/><rect x="148.0" y="194" width="172.0" height="50" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text xml:space="preserve" x="234.0" y="219" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="600" fill="#633806">카드</text><rect x="328.0" y="194" width="172.0" height="50" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text xml:space="preserve" x="414.0" y="219" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="600" fill="#633806">카드</text><text xml:space="preserve" x="518.0" y="219" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="700" fill="#633806">→ 2열</text><text xml:space="preserve" x="20" y="322" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="700" fill="#2C2C2A">데스크톱 1280px</text><rect x="140" y="288" width="544.0" height="70" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/><rect x="148.0" y="298" width="170.66666666666666" height="50" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text xml:space="preserve" x="233.33333333333331" y="323" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="600" fill="#633806">카드</text><rect x="326.66666666666663" y="298" width="170.66666666666666" height="50" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text xml:space="preserve" x="411.99999999999994" y="323" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="600" fill="#633806">카드</text><rect x="505.3333333333333" y="298" width="170.66666666666666" height="50" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text xml:space="preserve" x="590.6666666666666" y="323" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="600" fill="#633806">카드</text><text xml:space="preserve" x="694.0" y="323" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="700" fill="#633806">→ 3열</text><text xml:space="preserve" x="380" y="388" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">미디어 쿼리 없이 폭만 보고 1열 → 2열 → 3열 (280px짜리가 몇 개 들어가나)</text></svg>
