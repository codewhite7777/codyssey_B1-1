<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img"><title>모바일 퍼스트: 기본은 모바일, 넓어질수록 min-width로 더한다</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker></defs><rect width="760" height="400" fill="#FFFFFF" rx="12"/><text xml:space="preserve" x="380" y="24" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="17" font-weight="700" fill="#2C2C2A">모바일 퍼스트: 기본 = 휴대폰, 넓어지면 '더하기'</text><rect x="40" y="180" width="220" height="130" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text xml:space="preserve" x="150" y="202" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="700" fill="#085041">기본 스타일 (미디어 쿼리 밖)</text><text xml:space="preserve" x="56" y="228" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="400" fill="#085041">메뉴 숨김 + 햄버거 ≡</text><text xml:space="preserve" x="56" y="250" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="400" fill="#085041">기술 카드 1열, About 세로</text><text xml:space="preserve" x="56" y="272" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="400" fill="#085041">h1 2.5rem</text><rect x="270" y="130" width="220" height="180" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text xml:space="preserve" x="380" y="152" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#0C447C">+ @media (min-width: 768px)</text><text xml:space="preserve" x="286" y="178" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="400" fill="#0C447C">가로 메뉴, 햄버거 숨김</text><text xml:space="preserve" x="286" y="200" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="400" fill="#0C447C">기술 카드 2열, About 가로</text><text xml:space="preserve" x="286" y="222" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="400" fill="#0C447C">h1 3.5rem</text><rect x="500" y="80" width="220" height="230" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text xml:space="preserve" x="610" y="102" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#3C3489">+ @media (min-width: 1024px)</text><text xml:space="preserve" x="516" y="128" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="400" fill="#3C3489">기술 카드 4열</text><text xml:space="preserve" x="516" y="150" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="400" fill="#3C3489">Hero 여백 크게</text><text xml:space="preserve" x="516" y="172" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="400" fill="#3C3489">h1 4.5rem</text><line x1="40" y1="336" x2="728" y2="336" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="40" y1="330" x2="40" y2="342" stroke="#5F5E5A" stroke-width="1.6"/><text xml:space="preserve" x="44" y="356" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#5F5E5A">0px</text><line x1="270" y1="330" x2="270" y2="342" stroke="#5F5E5A" stroke-width="1.6"/><text xml:space="preserve" x="274" y="356" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#5F5E5A">768px</text><line x1="500" y1="330" x2="500" y2="342" stroke="#5F5E5A" stroke-width="1.6"/><text xml:space="preserve" x="504" y="356" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#5F5E5A">1024px</text><text xml:space="preserve" x="150" y="380" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">휴대폰</text><text xml:space="preserve" x="385" y="380" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">태블릿</text><text xml:space="preserve" x="615" y="380" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">데스크톱</text></svg>
