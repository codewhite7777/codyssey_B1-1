<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img"><title>localStorage로 다크 모드 설정을 저장하고 새로고침 때 복원하는 흐름</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker></defs><rect width="760" height="330" fill="#FFFFFF" rx="12"/><text xml:space="preserve" x="380" y="24" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="17" font-weight="700" fill="#2C2C2A">다크 모드가 새로고침 후에도 남는 이유: localStorage</text><text xml:space="preserve" x="20" y="44" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="700" fill="#0C447C">클릭할 때</text><rect x="20" y="58" width="110" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text xml:space="preserve" x="75.0" y="75" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="600" fill="#0C447C">다크 모드 click</text><rect x="145" y="58" width="160" height="34" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text xml:space="preserve" x="225.0" y="75" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#633806">STATE.theme = "dark"</text><line x1="131" y1="75" x2="143" y2="75" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="320" y="58" width="270" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text xml:space="preserve" x="455.0" y="75" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#3C3489">localStorage.setItem("theme", "dark")</text><line x1="306" y1="75" x2="318" y2="75" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="605" y="58" width="130" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text xml:space="preserve" x="670.0" y="75" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#085041">renderTheme()</text><line x1="591" y1="75" x2="603" y2="75" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><ellipse cx="455" cy="138" rx="125" ry="12" fill="#EEEDFE" stroke="#534AB7"/><path d="M330,138 V180 A125,12 0 0 0 580,180 V138" fill="#EEEDFE" stroke="#534AB7"/><text xml:space="preserve" x="455" y="166" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#3C3489">localStorage   theme: "dark"</text><text xml:space="preserve" x="640" y="166" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="400" fill="#3C3489">새로고침·창 닫기에도</text><text xml:space="preserve" x="640" y="182" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="400" fill="#3C3489">브라우저에 남음</text><line x1="455" y1="94" x2="455" y2="124" stroke="#534AB7" stroke-width="1.6" marker-end="url(#ah)"/><text xml:space="preserve" x="475" y="109" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="400" fill="#534AB7">저장</text><text xml:space="preserve" x="20" y="236" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="700" fill="#085041">새로고침할 때</text><rect x="20" y="250" width="150" height="34" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text xml:space="preserve" x="95.0" y="267" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="600" fill="#2C2C2A">페이지 시작 (10번)</text><rect x="185" y="250" width="220" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text xml:space="preserve" x="295.0" y="267" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#3C3489">localStorage.getItem("theme")</text><line x1="171" y1="267" x2="183" y2="267" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="420" y="250" width="160" height="34" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text xml:space="preserve" x="500.0" y="267" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#633806">STATE.theme = "dark"</text><line x1="406" y1="267" x2="418" y2="267" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><rect x="595" y="250" width="140" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text xml:space="preserve" x="665.0" y="267" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#085041">renderTheme()</text><line x1="581" y1="267" x2="593" y2="267" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/><line x1="400" y1="194" x2="310" y2="246" stroke="#534AB7" stroke-width="1.6" marker-end="url(#ah)"/><text xml:space="preserve" x="328" y="206" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="400" fill="#534AB7">읽기</text><text xml:space="preserve" x="380" y="308" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">저장된 값이 없으면 ( || "light" ) 라이트 모드로 시작</text></svg>
