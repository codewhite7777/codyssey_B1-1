<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img"><title>CSS 변수와 다크 모드: 같은 변수 이름에 다른 값</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker></defs><rect width="760" height="420" fill="#FFFFFF" rx="12"/><text xml:space="preserve" x="380" y="24" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="17" font-weight="700" fill="#2C2C2A">변수 이름은 그대로, 값만 바꿔서 다크 모드</text><rect x="220" y="44" width="320" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text xml:space="preserve" x="380" y="64" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="700" fill="#085041">JS: &lt;html data-theme="dark"&gt;로 바꿈</text><rect x="40" y="110" width="320" height="150" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="200" y="132" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#2C2C2A">:root  (기본 = 라이트)</text><text xml:space="preserve" x="60" y="162" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#2C2C2A">--color-bg</text><rect x="220" y="152" width="22" height="20" rx="4" fill="#fafbf8" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="252" y="162" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#5F5E5A">#fafbf8</text><text xml:space="preserve" x="60" y="194" t