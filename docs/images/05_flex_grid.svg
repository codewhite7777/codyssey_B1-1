<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img"><title>Flexbox는 한 줄 정렬, Grid는 행과 열 배치</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker></defs><rect width="760" height="360" fill="#FFFFFF" rx="12"/><text xml:space="preserve" x="190" y="26" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="16" font-weight="700" fill="#0C447C">Flexbox = 한 줄 (1차원)</text><text xml:space="preserve" x="570" y="26" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="16" font-weight="700" fill="#633806">Grid = 행과 열 (2차원)</text><rect x="20" y="50" width="340" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" stroke-dasharray="5 4"/><rect x="26" y="64" width="60" height="32" rx="5" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="56.0" y="80" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">LINK.</text><rect x="150" y="64" width="130" height="32" rx="5" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="215.0" y="80" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">소개 기술 프로젝트 문의</text><rect x="292" y="64" width="58" height="32" rx="5" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="321.0" y="80" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">다크 모드</text><line x1="30" y1="130" x2="350" y2="130" stroke="#185FA5" stroke-width="1.6" marker-end="url(#ah)"/><text xml:space="preserve" x="190" y="146" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#0C447C">주축(가로) 한 방향으로만 늘어섬</text><rect x="20" y="170" width="340" height="110" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="36" y="192" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">.nav {</text><text xml:space="preserve" x="36" y="209" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">  display: flex;</text><text xml:space="preserve" x="36" y="226" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">  justify-content: space-between;</text><text xml:space="preserve" x="36" y="243" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">  align-items: center;</text><text xml:space="preserve" x="36" y="260" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">}</text><text xml:space="preserve" x="190" y="304" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">→ 로고는 왼쪽 끝, 버튼은 오른쪽 끝</text><rect x="400" y="50" width="340" height="150" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1" stroke-dasharray="5 4"/><rect x="412" y="62" width="100" height="58" rx="5" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="462" y="91" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">카드 1</text><rect x="520" y="62" width="100" height="58" rx="5" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="570" y="91" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">카드 2</text><rect x="628" y="62" width="100" height="58" rx="5" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="678" y="91" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">카드 3</text><rect x="412" y="128" width="100" height="58" rx="5" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="462" y="157" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">카드 4</text><rect x="520" y="128" width="100" height="58" rx="5" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="570" y="157" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">카드 5</text><rect x="628" y="128" width="100" height="58" rx="5" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="678" y="157" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">카드 6</text><text xml:space="preserve" x="570" y="214" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#633806">가로(열)와 세로(행)를 같이 맞춤</text><rect x="400" y="230" width="340" height="70" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text xml:space="preserve" x="416" y="250" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">.project-grid {</text><text xml:space="preserve" x="416" y="267" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">  display: grid;</text><text xml:space="preserve" x="416" y="284" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2C2C2A">  grid-template-columns: repeat(...);</text><text xml:space="preserve" x="570" y="330" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">→ 카드 높이·너비가 줄마다 맞음</text></svg>
